<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" class="ghost" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </header>

    <section class="balance" aria-live="polite">
      <p class="label">Total Balance</p>
      <p id="total" class="amount">Rp0</p>
      <p id="limit-note" class="note"></p>
    </section>

    <main class="grid">
      <section class="card">
        <h2>Add transaction</h2>
        <form id="tx-form" novalidate>
          <label for="item">Item name</label>
          <input id="item" type="text" placeholder="e.g. Lunch" autocomplete="off">

          <label for="amount">Amount (Rp)</label>
          <input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 25000">

          <label for="category">Category</label>
          <select id="category"></select>

          <p id="form-error" class="error" role="alert"></p>
          <button type="submit" class="primary">Add transaction</button>
        </form>

        <div class="extras">
          <label for="new-category">New category</label>
          <div class="row">
            <input id="new-category" type="text" placeholder="e.g. Health" autocomplete="off">
            <button id="add-category" class="ghost" type="button">Add</button>
          </div>
          <p id="cat-error" class="error" role="alert"></p>

          <label for="limit">Highlight transactions above (Rp)</label>
          <input id="limit" type="number" min="0" step="1" inputmode="numeric" placeholder="0 = off">
        </div>
      </section>

      <section class="card">
        <h2>Spending by category</h2>
        <p id="chart-empty" class="empty">Add a transaction to see your chart.</p>
        <div class="chart-box"><canvas id="chart" hidden></canvas></div>
      </section>

      <section class="card wide">
        <h2>Transactions</h2>
        <p id="list-empty" class="empty">No transactions yet.</p>
        <ul id="list" class="list"></ul>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
